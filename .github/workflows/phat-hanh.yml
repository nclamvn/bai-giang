# Bản phát hành (docs/phat-hanh.md, mốc M7). Chạy khi đẩy tag v<x.y.z> (ví dụ v1.0.0) hoặc bấm chạy tay trên GitHub.
# Android: dựng AAB (gói tải lên Google Play) và APK bản phát hành. Có khoá tải lên trong GitHub secrets thì ký; chưa có thì dựng
# bản chưa ký và ghi rõ ở tóm tắt (Google Play không nhận bản chưa ký). Khoá không bao giờ nằm trong kho.
#   Secrets cần (Settings > Secrets and variables > Actions): ANDROID_UPLOAD_KEYSTORE_B64 (tệp .jks mã base64),
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD.
# iOS: cần tài khoản Apple Developer (chứng chỉ, hồ sơ cấp phép); các bước ở docs/phat-hanh.md, chưa tự động.
name: Phát hành
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Thư mục web của app và đồng bộ vào dự án Android
        run: |
          cd native && npm ci && cd ..
          python3 tools/build_native.py
          cd native && npx cap sync android
      - name: Số bản, khoá ký
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-thu.${GITHUB_RUN_NUMBER}"; fi
          echo "SAK_VERSION_NAME=$V" >> "$GITHUB_ENV"
          # số bản tăng dần theo số lần chạy của workflow này (Google Play đòi mỗi bản tải lên một số lớn hơn)
          echo "SAK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "SAK_KEYSTORE=$RUNNER_TEMP/upload.jks"; echo "SAK_KEYSTORE_PASSWORD=$KS_PASS"; echo "SAK_KEY_ALIAS=$KEY_ALIAS"; echo "SAK_KEY_PASSWORD=$KEY_PASS"; } >> "$GITHUB_ENV"
            echo "KY=co" >> "$GITHUB_ENV"
          else
            echo "KY=khong" >> "$GITHUB_ENV"
          fi
      - name: Dựng AAB và APK bản phát hành
        run: |
          cd native/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/phat-hanh"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/phat-hanh/sang-an-khoai-$SAK_VERSION_NAME.aab"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/phat-hanh/sang-an-khoai-$SAK_VERSION_NAME.apk"
          ls -l "$GITHUB_WORKSPACE/phat-hanh"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Tóm tắt
        run: |
          {
            echo "### Bản phát hành Android $SAK_VERSION_NAME (mã bản $SAK_VERSION_CODE)"
            if [ "$KY" = co ]; then echo "Đã ký bằng khoá tải lên: tải tệp .aab lên Google Play Console."
            else echo "**Chưa ký**: chưa có khoá tải lên trong GitHub secrets. Google Play không nhận bản này. Xem docs/phat-hanh.md."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: phat-hanh-android
          path: phat-hanh/
      - name: Bản nháp phát hành trên GitHub (khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" phat-hanh/* --draft --verify-tag --title "Sáng Ăn Khoai $SAK_VERSION_NAME" \
            --notes "Bản phát hành $SAK_VERSION_NAME. Ký: $KY. Gói .aab để tải lên Google Play; .apk để cài trực tiếp. Xem docs/phat-hanh.md."
