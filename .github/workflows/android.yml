# App Android (docs/app-ke-hoach-moc.md, mốc M4): dựng APK bản thử từ app/ của site bằng Capacitor (native/),
# chạy thử trên máy ảo Android (mở app, có Thư viện, mở một bài), rồi đăng APK lên bản phát hành thử "android-thu"
# để tải thẳng về điện thoại cài. Bản thử ký bằng khoá debug công khai trong kho (native/android/app/debug.keystore).
name: Android
on:
  push:
    branches: [main]
    paths: ['app/**', 'shell/**', 'native/**', 'tools/build_native.py', 'tools/goi_bai.py', 'tools/build_app.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Thư viện Capacitor
        run: cd native && npm ci
      - name: Thư mục web của app (native/www) và đồng bộ vào dự án Android
        run: |
          python3 tools/build_native.py
          cd native && npx cap sync android
      - name: Dựng APK
        run: |
          cd native/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sang-an-khoai.apk"
          ls -l "$GITHUB_WORKSPACE/sang-an-khoai.apk"
      - name: Chạy thử trên máy ảo Android (API 34)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | "$SDK/sdkmanager" --licenses > /dev/null
          "$SDK/sdkmanager" "system-images;android-34;google_apis;x86_64" "emulator" > /dev/null
          echo no | "$SDK/avdmanager" create avd -n thu -k "system-images;android-34;google_apis;x86_64" -d pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd thu -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot &
          python3 tests/kiem_android.py sang-an-khoai.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sang-an-khoai-apk
          path: |
            sang-an-khoai.apk
            kiem-android/
          if-no-files-found: ignore
      - name: Đăng bản thử android-thu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-thu --yes --cleanup-tag 2>/dev/null || true
          gh release create android-thu sang-an-khoai.apk --prerelease --target "$GITHUB_SHA" \
            --title "App Android bản thử (${GITHUB_SHA::7})" \
            --notes "Bản thử dựng tự động từ ${GITHUB_SHA::7}. Cài: tải tệp sang-an-khoai.apk trên điện thoại Android 7.0 trở lên, cho phép cài từ nguồn này. Ký bằng khoá debug: không dùng để phát hành. Xem docs/app-ke-hoach-moc.md mốc M4."
